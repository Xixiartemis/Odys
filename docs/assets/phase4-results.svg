<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Phase 4 real-provider controlled-fault experiment results</title>
  <desc id="desc">Legacy bounded recovery versus Odys V2 on validator-backed recovery, first replan, and remaining budget.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .ink { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #57606a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .head { font-size: 25px; font-weight: 700; }
    .sub { font-size: 15px; }
    .label { font-size: 17px; font-weight: 600; }
    .value { font-size: 24px; font-weight: 700; }
    .small { font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .ink { fill: #e6edf3; }
      .muted { fill: #8b949e; }
    }
  </style>
  <rect class="bg" width="1000" height="560" rx="18"/>
  <text class="ink head" x="42" y="58">Phase 4 · Real-provider controlled-fault experiment</text>
  <text class="muted sub" x="42" y="87">6 valid runs · 20-call provider budget · one controlled no-progress fault · not a general benchmark</text>

  <rect class="panel" x="42" y="122" width="916" height="250" rx="14"/>
  <text class="muted label" x="72" y="164">Metric</text>
  <text class="muted label" x="520" y="164">Legacy Bounded</text>
  <text class="ink label" x="770" y="164">Odys V2</text>
  <line x1="72" y1="184" x2="928" y2="184" stroke="#d0d7de"/>

  <text class="ink label" x="72" y="228">Validator-backed recovery</text>
  <text class="muted value" x="520" y="230">1 / 3</text>
  <text class="ink value" x="770" y="230">3 / 3</text>
  <line x1="72" y1="250" x2="928" y2="250" stroke="#d0d7de"/>

  <text class="ink label" x="72" y="294">First replan</text>
  <text class="muted value" x="520" y="296">19–20 calls</text>
  <text class="ink value" x="770" y="296">2–5 calls</text>
  <line x1="72" y1="316" x2="928" y2="316" stroke="#d0d7de"/>

  <text class="ink label" x="72" y="360">Budget at first replan</text>
  <text class="muted value" x="520" y="362">0–1 / 20</text>
  <text class="ink value" x="770" y="362">15–18 / 20</text>

  <rect class="panel" x="42" y="404" width="916" height="112" rx="14"/>
  <text class="ink label" x="72" y="442">V2 convergence</text>
  <text class="ink value" x="72" y="480">8 → 0</text>
  <text class="muted sub" x="220" y="478">redundant post-success executions across 3/3 V2 convergence runs</text>
</svg>
